<!DOCTYPE html>
<html>
<head>
    <title>Luminew Professor View (Fallback)</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }
        #video-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #status {
            position: absolute;
            top: 10px;
            left: 10px;
            color: rgba(255,255,255,0.5);
            font-size: 12px;
            background: rgba(0,0,0,0.5);
            padding: 4px 8px;
            border-radius: 4px;
        }
        .loading {
            position: absolute;
            color: white;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="video-container">
        <div id="status">WebView Fallback Mode</div>
        <video id="remote-video" autoplay playsinline></video>
        <div id="loading-msg" class="loading">正在連線至教授視訊...</div>
    </div>

    <script>
        // 從網址取得參數 (例如 ?session_id=xxx)
        const urlParams = new URLSearchParams(window.location.search);
        const streamId = urlParams.get('stream_id');
        const sessionId = urlParams.get('session_id');
        const apiKey = urlParams.get('api_key'); // 雖然不安全，但這是內測快速方案

        const videoElement = document.getElementById('remote-video');
        const loadingMsg = document.getElementById('loading-msg');
        let peerConnection;

        async function init() {
            if (!streamId || !apiKey) {
                loadingMsg.innerText = "Error: Missing Parameters";
                return;
            }

            try {
                // 1. 初始化 PeerConnection
                peerConnection = new RTCPeerConnection({
                    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                });

                peerConnection.ontrack = (event) => {
                    if (event.track.kind === 'video') {
                        videoElement.srcObject = event.streams[0];
                        loadingMsg.style.display = 'none';
                    }
                };

                // 2. 獲取 Offer (這裡假設後端已經啟動了 Stream，我們只是接手 WebRTC)
                // 注意：這部分邏輯需要與您的後端 API 配合
                // 為了簡化，WebView 模式通常會重新發起一個全新的網頁版 Stream
                setupNewStream();

            } catch (e) {
                loadingMsg.innerText = "Connection Failed: " + e.message;
            }
        }

        async function setupNewStream() {
            const auth = "Basic " + apiKey;
            
            // 創建新的 Stream
            const res = await fetch("https://api.d-id.com/talks/streams", {
                method: "POST",
                headers: { "Authorization": auth, "Content-Type": "application/json" },
                body: JSON.stringify({
                    source_url: "https://raw.githubusercontent.com/1yidayo/Luminew/refs/heads/main/Luminew/backend/assets/images/Paul.jpg"
                })
            });
            const data = await res.json();
            
            const pc = new RTCPeerConnection({ iceServers: data.ice_servers || [] });
            pc.ontrack = (e) => {
                videoElement.srcObject = e.streams[0];
                loadingMsg.style.display = 'none';
            };

            await pc.setRemoteDescription(data.offer);
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);

            await fetch(`https://api.d-id.com/talks/streams/${data.id}/sdp`, {
                method: "POST",
                headers: { "Authorization": auth, "Content-Type": "application/json" },
                body: JSON.stringify({ answer, session_id: data.session_id })
            });

            pc.onicecandidate = (e) => {
                if (e.candidate) {
                    fetch(`https://api.d-id.com/talks/streams/${data.id}/ice`, {
                        method: "POST",
                        headers: { "Authorization": auth, "Content-Type": "application/json" },
                        body: JSON.stringify({ ...e.candidate.toJSON(), session_id: data.session_id })
                    });
                }
            };
            
            // 通知宿主 App (Flutter) 我們拿到了新的 Stream ID
            if (window.Flutter) {
                window.Flutter.postMessage(JSON.stringify({ event: 'new_stream', id: data.id }));
            }
        }

        init();
    </script>
</body>
</html>
